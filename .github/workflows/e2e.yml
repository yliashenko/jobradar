name: e2e

# Playwright e2e for the jobradar web UI. Runs on main/dev and on every PR;
# plain branch pushes without a PR are skipped to save minutes.
on:
  push:
    branches: [main, dev]
  pull_request:

# A new push to the same ref cancels the previous unfinished run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Steps run from the suite folder. A worker fixture boots the app via
    # `python -m jobradar serve`, so both Node and Python (with Flask) are needed.
    defaults:
      run:
        working-directory: jobradar-e2e
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jobradar-e2e/package-lock.json

      - name: Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The product is on Flask now; the fixture starts it as a subprocess, so its
      # runtime deps must be present in the CI environment.
      - name: Product Python deps
        run: python3 -m pip install -r ../requirements.txt

      - name: Dependencies
        run: npm ci

      - name: Playwright browsers
        run: npx playwright install --with-deps

      # In CI the config enables retries: 2 and workers: 1 (via process.env.CI).
      - name: Tests
        run: npx playwright test

      # Keep the report unless the run was cancelled — it matters most on red.
      - name: HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: jobradar-e2e/playwright-report/
          retention-days: 7
