# pre-commit — the same checks as CI, locally before a commit.
# Install:     .venv/bin/pre-commit install
# Run by hand: .venv/bin/pre-commit run --all-files
#
# Duplicates the CI gate on purpose: cheaper to catch a problem before the push than in Actions.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff          # linter (with autofixes)
        args: [--fix]
      - id: ruff-format   # formatter

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Config and exclusion boundaries live in pyproject.toml [tool.mypy].
        pass_filenames: false
        args: []

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
